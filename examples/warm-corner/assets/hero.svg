<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" role="img" aria-label="Окно кофейни с чашкой на столе">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e3d2"/><stop offset="1" stop-color="#efd0b6"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8c5a35"/><stop offset="1" stop-color="#6e4426"/>
    </linearGradient>
  </defs>

  <rect width="800" height="620" fill="url(#wall)"/>

  <!-- window -->
  <rect x="70" y="60" width="660" height="360" rx="26" fill="url(#sky)"/>
  <circle cx="620" cy="150" r="46" fill="#f6b26b" opacity=".85"/>
  <path d="M70 330c90-46 150 12 236-24 86-36 140 24 220-6 40-15 78-6 204 22v98H70z" fill="#c98a56" opacity=".55"/>
  <path d="M70 366c110-30 168 22 262-6 94-28 150 16 250-4 30-6 84 6 148 18v46H70z" fill="#a06a3e" opacity=".5"/>
  <rect x="392" y="60" width="16" height="360" fill="#6e4426" opacity=".8"/>
  <rect x="70" y="232" width="660" height="14" fill="#6e4426" opacity=".8"/>

  <!-- counter -->
  <rect x="0" y="430" width="800" height="190" fill="#3a2a1c"/>
  <rect x="0" y="430" width="800" height="18" fill="#4d3826"/>

  <!-- cup -->
  <g transform="translate(300 452)">
    <ellipse cx="100" cy="126" rx="120" ry="16" fill="#2a1d13" opacity=".55"/>
    <path d="M28 24h144v58a58 58 0 0 1-58 58H86a58 58 0 0 1-58-58V24z" fill="#fbf7f2"/>
    <path d="M172 40h20a30 30 0 0 1 0 60h-20" fill="none" stroke="#fbf7f2" stroke-width="12" stroke-linecap="round"/>
    <ellipse cx="100" cy="24" rx="72" ry="15" fill="#e9ded3"/>
    <ellipse cx="100" cy="24" rx="56" ry="11" fill="#b4541f"/>
    <path d="M74 4c0-14 14-14 14-28M104 4c0-14 14-14 14-28M134 4c0-12 12-12 12-24"
          fill="none" stroke="#f3e2d5" stroke-width="7" stroke-linecap="round" opacity=".85"/>
  </g>

  <!-- saucer of beans -->
  <g transform="translate(600 520)">
    <ellipse cx="0" cy="30" rx="86" ry="22" fill="#4d3826"/>
    <g fill="#2a1d13">
      <ellipse cx="-38" cy="22" rx="17" ry="12" transform="rotate(-18 -38 22)"/>
      <ellipse cx="-4" cy="30" rx="17" ry="12" transform="rotate(12 -4 30)"/>
      <ellipse cx="34" cy="20" rx="17" ry="12" transform="rotate(-8 34 20)"/>
